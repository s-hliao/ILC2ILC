# Host-side environment (no ROS): check_model, replay_trials.py in the MuJoCo viewer.
#   conda env create -f environment.yml && conda activate mj_quad
name: mj_quad
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - mujoco==3.12.0
      - casadi==3.8.1
      - numpy==2.5.2
      - scipy==1.18.1
      - matplotlib==3.11.1
      - imageio==2.37.4
      - imageio-ffmpeg==0.6.0
      - glfw==2.10.2
      - pyopengl==3.1.10
